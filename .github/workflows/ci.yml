# Workflow'un adı (Actions sekmesinde görünür)
name: CI

# NE ZAMAN çalışsın?
on:
  push:
    branches: [main]      # main'e her push'ta
  pull_request:           # ve her pull request'te

# NE yapsın?
jobs:
  test:                         # job'ın adı
    runs-on: ubuntu-latest      # GitHub'ın verdiği boş Ubuntu bilgisayar

    # Aynı testi 3 farklı Python sürümünde, paralel çalıştır
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # 1. Kodu runner'a indir (yoksa makine boş!)
      - name: Kodu indir
        uses: actions/checkout@v4

      # 2. Matrix'teki Python sürümünü kur
      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Paketleri kur
      - name: Paketleri kur
        run: pip install -r requirements.txt

      # 4. Testleri coverage ölçümüyle çalıştır
      - name: Testleri çalıştır (coverage ile)
        run: pytest -v --cov=app --cov-report=xml --cov-report=term

      # 5. Coverage raporunu indirilebilir dosya (artifact) olarak sakla
      - name: Coverage raporunu yükle
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}   # her sürüm için ayrı isim
          path: coverage.xml

  docker:
    needs: test                       # test GEÇMEDEN başlama!
    if: github.event_name == 'push'   # sadece push'ta (PR'da değil)
    runs-on: ubuntu-latest

    steps:
      # 1. Kodu indir (her job ayrı bilgisayar, kod yine yok!)
      - name: Kodu indir
        uses: actions/checkout@v4

      # 2. Docker build aracını hazırla
      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub'a giriş (secret'lar burada kullanılıyor)
      - name: Docker Hub'a giriş
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build al ve Docker Hub'a yükle
      - name: Build ve push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:latest

  deploy:
    needs: docker                     # image Docker Hub'a yüklenmeden başlama!
    runs-on: ubuntu-latest

    steps:
      # SSH ile EC2'ye bağlan ve yeni sürümü çalıştır
      - name: EC2'ye deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:${{ github.sha }}
            docker stop api || true
            docker rm api || true
            docker run -d --name api --restart unless-stopped -p 80:5000 ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:${{ github.sha }}
            docker stop bot || true
            docker rm bot || true
            docker run -d --name bot --restart unless-stopped \
              -e TELEGRAM_TOKEN='${{ secrets.TELEGRAM_TOKEN }}' \
              -e TELEGRAM_CHAT_ID='${{ secrets.TELEGRAM_CHAT_ID }}' \
              -e TELEGRAM_KULLANICILAR='${{ secrets.TELEGRAM_KULLANICILAR }}' \
              ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:${{ github.sha }} python bot.py
            docker image prune -f

  notify:
    needs: [test, docker, deploy]     # üçünü de izle
    if: failure()                     # SADECE biri kırmızı yanarsa çalış
    runs-on: ubuntu-latest

    steps:
      # Telegram grubuna hata mesajı gönder
      - name: Telegram'a hata bildirimi
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🔴 mochi-fortune pipeline'ı kırmızı yandı!
          Commit: ${GITHUB_SHA::7}
          Gönderen: ${GITHUB_ACTOR}
          Log: ${LOG_URL}"
