# Workflow'un adı (Actions sekmesinde görünür)
name: CI

# NE ZAMAN çalışsın?
on:
  push:
    branches: [main]      # main'e her push'ta
  pull_request:           # ve her pull request'te

# NE yapsın?
jobs:
  test:                         # job'ın adı
    runs-on: ubuntu-latest      # GitHub'ın verdiği boş Ubuntu bilgisayar

    steps:
      # 1. Kodu runner'a indir (yoksa makine boş!)
      - name: Kodu indir
        uses: actions/checkout@v4

      # 2. Python 3.12 kur (Dockerfile ile aynı sürüm)
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Paketleri kur
      - name: Paketleri kur
        run: pip install -r requirements.txt

      # 4. Testleri çalıştır
      - name: Testleri çalıştır
        run: pytest -v

  docker:
    needs: test                       # test GEÇMEDEN başlama!
    if: github.event_name == 'push'   # sadece push'ta (PR'da değil)
    runs-on: ubuntu-latest

    steps:
      # 1. Kodu indir (her job ayrı bilgisayar, kod yine yok!)
      - name: Kodu indir
        uses: actions/checkout@v4

      # 2. Docker build aracını hazırla
      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub'a giriş (secret'lar burada kullanılıyor)
      - name: Docker Hub'a giriş
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build al ve Docker Hub'a yükle
      - name: Build ve push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:latest

  deploy:
    needs: docker                     # image Docker Hub'a yüklenmeden başlama!
    runs-on: ubuntu-latest

    steps:
      # SSH ile EC2'ye bağlan ve yeni sürümü çalıştır
      - name: EC2'ye deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:${{ github.sha }}
            docker stop api || true
            docker rm api || true
            docker run -d --name api --restart unless-stopped -p 80:5000 ${{ secrets.DOCKERHUB_USERNAME }}/mochi-fortune:${{ github.sha }}
            docker image prune -f
